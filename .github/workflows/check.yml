name: OAX alerts
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      diagnose:
        description: 'Diagnostic only (no Telegram alerts)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: oax-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read calendar
        env:
          OAX_USERNAME: ${{ secrets.OAX_USERNAME }}
          OAX_PASSWORD: ${{ secrets.OAX_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIAGNOSE: ${{ inputs.diagnose }}
        run: |
          if [ "$DIAGNOSE" = "true" ]; then
            python monitor.py --diagnose
          else
            python monitor.py
          fi
      - uses: actions/upload-artifact@v4
        if: success() && inputs.diagnose
        with:
          name: calendar-diagnostics
          path: diagnostics.json
          retention-days: 3
      - name: Save notification state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save OAX notification state'
              git push
            fi
          fi
